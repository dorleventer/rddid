# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? https://github.com/r-lib/actions#where-to-find-help
#
# Installs only the hard dependencies (Depends, Imports, LinkingTo) plus testthat, knitr
# and rmarkdown, and checks the package without any other suggested package (ggplot2,
# modelsummary, broom). Every use of a suggested package must be guarded.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: check-no-suggests.yaml

permissions: read-all

jobs:
  check-no-suggests:
    runs-on: ubuntu-latest

    name: ubuntu-latest (release, no suggests)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          cache: false
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
