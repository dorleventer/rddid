url: https://dorleventer.github.io/rddid/
template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, articles, reference]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/rddid-estimation.html
    articles:
      text: Articles
      menu:
        - text: Checking the identification assumptions
          href: articles/rddid-validation-tests.html
        - text: Plots of the estimate and the checks
          href: articles/rddid-plots.html
        - text: Bandwidth rules and sampling schemes
          href: articles/rddid-options.html
        - text: How rddid() computes the estimate (for referees)
          href: articles/rddid-how-it-works.html

articles:
  - title: Get started
    navbar: ~
    contents:
      - rddid-estimation
  - title: Articles
    navbar: ~
    contents:
      - rddid-validation-tests
      - rddid-plots
      - rddid-options
      - rddid-how-it-works

reference:
  - title: Package overview
    contents:
      - rddid-package
  - title: Estimate
    desc: The RD-DID estimator and what to do with a fit.
    contents:
      - rddid
      - summary.rddid
      - plot.rddid
      - rddid-methods
      - rddid-tidiers
  - title: Check the assumptions
    desc: >
      Tests of the identification assumptions when the running variable moves
      over time, so that units can change side of the cutoff between periods.
    contents:
      - rd_typecont
      - rd_compstable
      - rd_homog
      - rd_trendcell
      - plot.rd_typecont
      - plot.rd_compstable
      - plot.rd_homog
      - plot.rd_trendcell
      - plot_switchers
  - title: Building blocks
    desc: The local-linear RD in one period and its CCT bandwidths, for working period by period.
    contents:
      - rd_period
      - rd_bw_cct
  - title: Data
    desc: Simulated panels for trying things out.
    contents:
      - rddid_sim
      - rddid_sim_pv
