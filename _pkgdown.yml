url: https://dorleventer.github.io/didisc/
template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, articles, reference]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/didisc-estimation.html
    articles:
      text: Articles
      menu:
        - text: Checking the identification assumptions
          href: articles/didisc-validation-tests.html
        - text: Plots of the estimate and the checks
          href: articles/didisc-plots.html
        - text: Bandwidth rules and sampling schemes
          href: articles/didisc-options.html
        - text: How didisc() computes the estimate
          href: articles/didisc-how-it-works.html

articles:
  - title: Get started
    navbar: ~
    contents:
      - didisc-estimation
  - title: Articles
    navbar: ~
    contents:
      - didisc-validation-tests
      - didisc-plots
      - didisc-options
      - didisc-how-it-works

reference:
  - title: Package overview
    contents:
      - didisc-package
  - title: Estimate
    desc: The diff-in-disc estimator and what to do with a fit.
    contents:
      - didisc
      - summary.didisc
      - plot.didisc
      - didisc-methods
      - didisc-tidiers
      - reexports
  - title: Check the assumptions
    desc: >
      Tests of the identification assumptions when the running variable moves
      over time, so that units can change side of the cutoff between periods.
    contents:
      - rd_checks
      - rd_typecont
      - rd_compstable
      - rd_homog
      - rd_trendcell
      - plot.rd_typecont
      - plot.rd_compstable
      - plot.rd_homog
      - plot.rd_trendcell
      - plot_switchers
  - title: Building blocks
    desc: The local-linear RD in one period and its CCT bandwidths, for working period by period.
    contents:
      - rd_period
      - rd_bw_cct
  - title: Data
    desc: Simulated panels for trying things out.
    contents:
      - didisc_sim
      - didisc_sim_pv
